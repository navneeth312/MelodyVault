spring.application.name=melodyvault-backend
server.port=${PORT:8085}

# Default profile: dev (uses local persistent H2 database)
# Switch to prod with: SPRING_PROFILES_ACTIVE=prod
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Static Resources & Multipart Handling
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
spring.web.resources.static-locations=classpath:/static/

# OpenAPI Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Security, Persistence & CORS Defaults
spring.jpa.open-in-view=false
melodyvault.security.cookie-secure=${COOKIE_SECURE:false}
melodyvault.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,http://localhost:3001,http://127.0.0.1:3001,http://localhost:5173}
melodyvault.security.creator-password=${CREATOR_PASSWORD:#{null}}

# Portable Demo Music Library Directory (Repository default: public/demo-music)
melodyvault.music.directory=${MUSIC_LIBRARY_DIR:public/demo-music}
