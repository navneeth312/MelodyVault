# Production Profile - Dedicated PostgreSQL Database
# Strictly fail-fast: if environment variables are not supplied, the backend will fail to start.
spring.datasource.url=${DATASOURCE_URL}
spring.datasource.username=${DATASOURCE_USERNAME}
spring.datasource.password=${DATASOURCE_PASSWORD}
spring.datasource.driverClassName=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Security Hardening
melodyvault.security.cookie-secure=true
melodyvault.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://melodyvault.com}

# Disable H2 console in production
spring.h2.console.enabled=false

# Suppress detailed SQL query logs in production
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql=WARN
logging.level.org.springframework.web=WARN
